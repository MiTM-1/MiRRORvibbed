name: Build isolated H3 add-ons candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/dev/h3-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./mirrorvidgen-worker
          file: ./mirrorvidgen-worker/Dockerfile.addons
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mitm-1/mirrorvidgen-worker:h3-addons-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/MiTM-1/MiRRORvibbed
            org.opencontainers.image.description=Experimental H3 add-ons; paid tests disabled by default
