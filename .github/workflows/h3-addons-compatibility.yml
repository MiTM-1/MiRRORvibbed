name: H3 add-ons unpaid checks
on:
  push:
    branches: [dev/h3-motion-turbo-preparation-20261008]
    paths: ["mirrorvidgen-worker/**", ".github/workflows/h3-addons-compatibility.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Compile candidate and baseline modules
        run: python -m compileall -q mirrorvidgen-worker
      - name: Unpaid graph and recovery tests
        working-directory: mirrorvidgen-worker
        run: python -m unittest discover -s tests -p 'test_h3_addons.py' -v
