name: Deploy isolated Modal staging

on:
  push:
    branches: [dev/modal-migration-v136]
    paths:
      - "modal_mirrorvidgen.py"
      - "mirrorvidgen-worker/Dockerfile.modal"
      - "mirrorvidgen-worker/tests/test_modal_contract.py"
      - ".github/workflows/modal-staging.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Validation or isolated deployment"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy
          - audit
          - bootstrap

permissions:
  contents: read

jobs:
  modal-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "modal==1.6.2" requests pillow numpy
      - name: Configure Modal credentials
        env:
          MODAL_TOKEN_COMMAND: ${{ secrets.MODAL_TOKEN_COMMAND }}
        run: |
          test -n "$MODAL_TOKEN_COMMAND"
          eval "$MODAL_TOKEN_COMMAND"
          modal profile activate mitm-1
      - name: Run unpaid worker and Modal contract tests
        run: |
          python -m compileall -q mirrorvidgen-worker modal_mirrorvidgen.py
          python -m unittest discover -s mirrorvidgen-worker/tests -p 'test_*.py' -v
      - name: Deploy isolated scale-to-zero staging app
        if: inputs.action == 'deploy' || inputs.action == 'audit' || inputs.action == 'bootstrap' || contains(github.event.head_commit.message, '[modal-deploy]')
        run: modal deploy modal_mirrorvidgen.py
      - name: Run deployed native renderer health check
        if: inputs.action == 'deploy' || inputs.action == 'audit' || inputs.action == 'bootstrap' || contains(github.event.head_commit.message, '[modal-deploy]')
        run: modal run modal_mirrorvidgen.py --command native-health

      - name: Run read-only Modal H3 volume audit
        if: inputs.action == 'audit' || inputs.action == 'bootstrap'
        run: modal run modal_mirrorvidgen.py --command h3-audit
      - name: Bootstrap the isolated Modal H3 runtime
        if: inputs.action == 'bootstrap'
        run: modal run modal_mirrorvidgen.py --command h3-bootstrap
      - name: Verify the bootstrapped Modal H3 runtime
        if: inputs.action == 'bootstrap'
        run: modal run modal_mirrorvidgen.py --command h3-audit
