name: Build American TV EPG

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/american-tv-epg.yml'
      - 'iptv/build_american_tv_epg.py'
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build filtered merged EPG
        run: python iptv/build_american_tv_epg.py

      - name: Commit guide
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iptv/AmericanTV_EPG.xml iptv/AmericanTV_EPG.xml.gz iptv/AmericanTV_EPG_STATUS.txt
          if git diff --cached --quiet; then
            echo 'No EPG changes'
            exit 0
          fi
          git commit -m 'Update American TV EPG'
          git push
