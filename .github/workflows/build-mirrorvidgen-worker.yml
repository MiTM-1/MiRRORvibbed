name: Build MiRRORvidgen RunPod Worker

on:
  push:
    branches: [main]
    paths:
      - "mirrorvidgen-worker/**"
      - ".github/workflows/build-mirrorvidgen-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mirrorvidgen-worker
          file: ./mirrorvidgen-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mitm-1/mirrorvidgen-worker:latest
            ghcr.io/mitm-1/mirrorvidgen-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/MiTM-1/MiRRORvibbed
            org.opencontainers.image.description=MiRRORvidgen LTX-2.5 RunPod worker
